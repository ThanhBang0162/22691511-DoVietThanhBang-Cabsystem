openapi: 3.0.3
info:
  title: CAB System API - FR35 Submit Trip Rating and Review
  version: 1.0.0
paths:
  /api/v1/trips/{tripId}/reviews:
    post:
      summary: FR35 - Cho phép khách hàng gửi đánh giá & phản hồi chuyến đi
      description: "API cho phép khách hàng gửi điểm số đánh giá (sao) và nhận xét phản hồi về chất lượng phục vụ của tài xế sau khi chuyến đi hoàn thành."
      operationId: submitTripReview
      tags:
        - Rating & Review
      security:
        - BearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          description: "Mã định danh duy nhất của chuyến đi cần đánh giá."
          schema:
            type: integer
            format: int64
            example: 9001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitReviewRequest'
      responses:
        '201':
          description: "Gửi đánh giá và phản hồi thành công."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitReviewSuccessResponse'
        '400':
          description: "Điểm đánh giá không hợp lệ hoặc chuyến đi chưa ở trạng thái hoàn thành."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: "Chưa xác thực token hoặc Token hết hạn."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Không tìm thấy chuyến đi tương ứng."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "Chuyến đi này đã được gửi đánh giá trước đó."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "Lỗi hệ thống nội bộ."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SubmitReviewRequest:
      type: object
      required:
        - rating
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: "Điểm số đánh giá chất lượng chuyến đi (từ 1 đến 5 sao)."
          example: 5
        comment:
          type: string
          maxLength: 500
          description: "Nhận xét chi tiết của khách hàng về chuyến đi."
          example: "Tài xế lái xe an toàn, vui vẻ và thân thiện."
        tags:
          type: array
          items:
            type: string
          description: "Các nhãn phản hồi nhanh (ví dụ: Xe sạch sẻ, Lái xe an toàn...)."
          example: ["CLEAN_VEHICLE", "SAFE_DRIVING", "POLITE"]

    TripReviewData:
      type: object
      properties:
        reviewId:
          type: integer
          format: int64
          example: 6001
        tripId:
          type: integer
          format: int64
          example: 9001
        customerId:
          type: integer
          format: int64
          example: 1001
        driverId:
          type: integer
          format: int64
          example: 201
        rating:
          type: integer
          example: 5
        comment:
          type: string
          example: "Tài xế lái xe an toàn, vui vẻ và thân thiện."
        tags:
          type: array
          items:
            type: string
          example: ["CLEAN_VEHICLE", "SAFE_DRIVING", "POLITE"]
        createdAt:
          type: string
          format: date-time
          example: "2026-09-16T14:40:00Z"

    SubmitReviewSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Gửi đánh giá và phản hồi chuyến đi thành công."
        data:
          $ref: '#/components/schemas/TripReviewData'

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        errorCode:
          type: string
          example: "REVIEW_ALREADY_SUBMITTED"
        message:
          type: string
          example: "Bạn đã gửi đánh giá cho chuyến đi này rồi."
        timestamp:
          type: string
          format: date-time
          example: "2026-09-16T14:40:00Z"
