openapi: 3.0.3
info:
  title: CAB System API - FR45 Promotion Management
  version: 1.0.0
paths:
  /api/v1/admin/promotions:
    post:
      summary: FR45 - Tạo mới mã khuyến mãi và chương trình giảm giá
      description: "API dành cho Quản trị viên (Admin) để khởi tạo các mã giảm giá, thiết lập tỷ lệ/số tiền giảm, điều kiện áp dụng, thời gian hiệu lực và giới hạn lượt sử dụng."
      operationId: createPromotion
      tags:
        - Admin - Promotion Management
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePromotionRequest'
      responses:
        '201':
          description: "Tạo mới mã khuyến mãi thành công."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePromotionSuccessResponse'
        '400':
          description: "Dữ liệu cấu hình chương trình khuyến mãi không hợp lệ."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: "Chưa xác thực token hoặc Token hết hạn."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Không có quyền Quản trị viên (Admin) để thực hiện hành động này."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "Mã khuyến mãi đã tồn tại trong hệ thống."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "Lỗi hệ thống nội bộ."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CreatePromotionRequest:
      type: object
      required:
        - promoCode
        - discountType
        - discountValue
        - startDate
        - endDate
        - maxUsageLimit
      properties:
        promoCode:
          type: string
          description: "Mã khuyến mãi (viết hoa, không dấu, viết liền)."
          example: "WELCOME2026"
        title:
          type: string
          description: "Tên chương trình khuyến mãi."
          example: "Ưu đãi chào mừng khách hàng mới"
        discountType:
          type: string
          enum: [PERCENTAGE, FIXED_AMOUNT]
          description: "Loại giảm giá: PERCENTAGE (theo %) hoặc FIXED_AMOUNT (số tiền cố định)."
          example: "PERCENTAGE"
        discountValue:
          type: number
          format: double
          minimum: 0
          description: "Giá trị giảm (ví dụ: 20 đối với 20%, hoặc 30000 đối với 30.000 VND)."
          example: 20
        maxDiscountAmount:
          type: number
          format: double
          minimum: 0
          description: "Số tiền giảm tối đa (áp dụng khi discountType = PERCENTAGE)."
          example: 50000
        minTripFare:
          type: number
          format: double
          minimum: 0
          description: "Giá trị chuyến đi tối thiểu để áp dụng mã (VND)."
          example: 100000
        startDate:
          type: string
          format: date-time
          description: "Thời gian bắt đầu áp dụng mã."
          example: "2026-09-16T00:00:00Z"
        endDate:
          type: string
          format: date-time
          description: "Thời gian kết thúc áp dụng mã."
          example: "2026-12-31T23:59:59Z"
        maxUsageLimit:
          type: integer
          minimum: 1
          description: "Tổng số lượt sử dụng tối đa của mã."
          example: 1000
        maxUsagePerUser:
          type: integer
          minimum: 1
          description: "Số lượt sử dụng tối đa trên mỗi người dùng."
          example: 1

    PromotionData:
      type: object
      properties:
        promotionId:
          type: integer
          format: int64
          example: 501
        promoCode:
          type: string
          example: "WELCOME2026"
        title:
          type: string
          example: "Ưu đãi chào mừng khách hàng mới"
        discountType:
          type: string
          enum: [PERCENTAGE, FIXED_AMOUNT]
          example: "PERCENTAGE"
        discountValue:
          type: number
          format: double
          example: 20
        maxDiscountAmount:
          type: number
          format: double
          example: 50000
        minTripFare:
          type: number
          format: double
          example: 100000
        startDate:
          type: string
          format: date-time
          example: "2026-09-16T00:00:00Z"
        endDate:
          type: string
          format: date-time
          example: "2026-12-31T23:59:59Z"
        maxUsageLimit:
          type: integer
          example: 1000
        currentUsageCount:
          type: integer
          example: 0
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-09-16T14:55:00Z"

    CreatePromotionSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Tạo mới mã khuyến mãi thành công."
        data:
          $ref: '#/components/schemas/PromotionData'

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        errorCode:
          type: string
          example: "PROMO_CODE_ALREADY_EXISTS"
        message:
          type: string
          example: "Mã khuyến mãi 'WELCOME2026' đã tồn tại trong hệ thống."
        timestamp:
          type: string
          format: date-time
          example: "2026-09-16T14:55:00Z"
