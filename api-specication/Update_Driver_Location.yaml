openapi: 3.0.3
info:
  title: CAB System API - FR14 Update Driver Location
  version: 1.0.0
paths:
  /api/v1/drivers/location:
    post:
      summary: FR14 - Ghi nhận và cập nhật vị trí thời gian thực của tài xế
      description: "API nhận tọa độ GPS (Latitude, Longitude) từ thiết bị của tài xế định kỳ để lưu vết vị trí, phục vụ tìm kiếm tài xế gần khách hàng và tính toán thời gian đến (ETA)."
      operationId: updateDriverLocation
      tags:
        - Driver Location
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLocationRequest'
      responses:
        '200':
          description: "Cập nhật vị trí tài xế thành công."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateLocationSuccessResponse'
        '400':
          description: "Tọa độ vĩ độ hoặc kinh độ không hợp lệ."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: "Chưa xác thực token hoặc Token hết hạn."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "Lỗi hệ thống nội bộ."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UpdateLocationRequest:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: "Tọa độ vĩ độ (Latitude) hiện tại của tài xế."
          example: 10.7769
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: "Tọa độ kinh độ (Longitude) hiện tại của tài xế."
          example: 106.7009
        heading:
          type: number
          format: float
          minimum: 0
          maximum: 360
          description: "Góc di chuyển/hướng của phương tiện tính theo độ (không bắt buộc)."
          example: 180.5
        speed:
          type: number
          format: float
          minimum: 0
          description: "Vận tốc di chuyển hiện tại tính bằng km/h (không bắt buộc)."
          example: 35.2

    DriverLocationData:
      type: object
      properties:
        driverId:
          type: integer
          format: int64
          example: 201
        latitude:
          type: number
          format: double
          example: 10.7769
        longitude:
          type: number
          format: double
          example: 106.7009
        recordedAt:
          type: string
          format: date-time
          example: "2026-09-16T13:15:00Z"

    UpdateLocationSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Ghi nhận vị trí tài xế thành công."
        data:
          $ref: '#/components/schemas/DriverLocationData'

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        errorCode:
          type: string
          example: "INVALID_COORDINATES"
        message:
          type: string
          example: "Tọa độ GPS nằm ngoài phạm vi hợp lệ."
        timestamp:
          type: string
          format: date-time
          example: "2026-09-16T13:15:00Z"
